# ArchUnit configuration for the nightly ring report (ADR-015).
#
# Resolving every missing class from the classpath is ArchUnit's default and is a
# documented order-of-magnitude cost. Resolving none is the other extreme, and it
# degrades exactly what these rules depend on: the type hierarchy of our own
# packages, which decides whether a class is a port failure and whether a domain
# class implements a port interface.
#
# So: resolve com.example.app fully, stub everything else.
classResolver=com.tngtech.archunit.core.importer.resolvers.SelectedClassResolverFromClasspath
classResolver.args=com.example.app

# The freeze store keeps its defaults deliberately (ADR-015): the directory is
# archunit_store/ relative to the module basedir, and allowStoreCreation stays
# false so CI can never mint a baseline. It does not exist yet — every rule is
# green. When a rule is first declared frozen, create the store once with
#   mvn -Parchitecture verify -pl core \
#       -Darchunit.freeze.store.default.allowStoreCreation=true
# and re-baseline an existing one with -Darchunit.freeze.refreeze=true. Either
# way it is a committed diff someone has to approve.
#
# allowStoreUpdate is true by default, so a local run that finds a frozen
# violation no longer present rewrites the store to drop it. That is how the
# store shrinks as debt is paid. It never grows: a new violation fails the run.
