# Secret-scan allowlist
#
# Read by the "Scan for committed literal credentials" step of
# .github/workflows/build.yaml.
#
# Each entry is a COMMENT line (starting with #) that gives the justification,
# followed immediately by a PATH line (relative to the repo root).  The scanner
# suppresses a finding when the file path is EXACTLY EQUAL to the PATH value, so
# a bare directory name covers nothing.
#
# Rules:
#   - One entry per file.  A path must name a file, not a directory.
#   - Every entry must carry a written justification.
#   - Never list a bare value substring here; allowances are path-anchored only.
#   - An entry that suppresses nothing is a defect, not a harmless leftover: it
#     documents a shape the file no longer has, and it hides the fact that
#     nothing is being suppressed.  Remove it.
#
# Typical legitimate entries: a Testcontainers-only literal in an integration
# test, a test whose subject is that a password is redacted or refused (so it
# must send one), an i18n bundle whose "password" key is a form label.

# Scanner self-test fixture: contains deliberately planted literals to verify that
# the scanner catches violations.  None of the values are real credentials; the
# file exists only to exercise the detection logic.
.github/test-fixtures/secret-scan-selftest-violations.env
