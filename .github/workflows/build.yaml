name: Build

# Single CI workflow: credential scan, Maven verify and the portal's checks,
# in one job.
#
# One job on purpose: GitHub bills each job rounded up to the whole minute, so
# a ~10s credential scan in its own job would cost a full minute on every
# event. The scan runs before the toolchain is installed, so a leaked
# credential fails the run in seconds instead of after a full build.
#
# A pull request runs the checks its changes can reach — the Java build, the
# portal's, both or neither — and the scheduled and manual runs run every
# check, the journey suite included (ADR-029; the scope step below).

on:
  pull_request:
    branches:
      - main
  schedule:
    # Nightly main check. It is also the only lane that runs the browser
    # journey suite (see the Journey steps below), and a signal that main is
    # healthy after merges when no push build exists.
    - cron: '0 3 * * *'
  workflow_dispatch:

run-name: >-
  ${{ github.event_name == 'schedule' && 'Scheduled main check' ||
      github.event_name == 'workflow_dispatch' && 'Manual main check' ||
      format('PR #{0}', github.event.pull_request.number) }}

permissions:
  contents: read
  # Needed to list a pull request's changed files for the scope step below.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Credential scan patterns (see the main scan step for details):
#
#   A   *PASSWORD* variable assigned a non-env literal — shell, YAML, properties.
#       Catches: APP_DB_PASSWORD=value, POSTGRES_PASSWORD=value
#       Skips:   …=${VAR:-default}  …="$VAR"  …='$VAR'  …=${VAR:?…}
#
#   A2  *PASSWD* variable assigned a non-env literal (same syntax, shorter key).
#       Catches: POSTGRES_PASSWD=value
#
#   B   password / passwd / pwd key assigned a non-env literal.
#       YAML, Docker Compose, properties: key: value
#       Skips: password: ${VAR:}  password: ${VAR:-default}  password: "${VAR}"
#
#   B2  "password" key with a quoted JSON value.
#       Catches: "password": "value"
#
#   C  Credential embedded in a connection URL.
#      Catches: scheme://user:secret@host  ?password=value  &password=value
#
# Allowlist: .github/secret-scan-allowlist.conf  (path-anchored, with justification)
# Self-test fixtures:
#   .github/test-fixtures/secret-scan-selftest-violations.env  (violation direction)
#   .github/test-fixtures/secret-scan-selftest-clean.env       (clean direction)

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # Self-test: verify the scanner catches violations before trusting it.
      # Runs the patterns against a committed fixture file that contains one
      # planted literal for each supported syntax.  Fails the job if the
      # patterns match nothing, which would mean the scanner is silently broken.
      # The fixture is allowlisted in secret-scan-allowlist.conf.
      # -----------------------------------------------------------------------
      - name: Self-test — scanner must detect planted literals
        run: |
          FIXTURE=".github/test-fixtures/secret-scan-selftest-violations.env"

          # Pattern A: *PASSWORD* = <non-env literal>
          PAT_A='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'

          # Pattern A2: *PASSWD* = <non-env literal>  (6-char form, no O-R)
          PAT_A2='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'

          # Pattern B: password|passwd|pwd key: <non-env literal>  (YAML/properties)
          PAT_B='[Pp]assword[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_BPASWD='[Pp]asswd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_B_PWD='pwd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'

          # Pattern B2: "password" : "literal"  (quoted JSON key and value)
          PAT_B2='"[Pp]assword"[[:space:]]*:[[:space:]]*"[^"$]'

          FOUND=$(grep -En \
            -e "$PAT_A" -e "$PAT_A2" \
            -e "$PAT_B" -e "$PAT_BPASWD" -e "$PAT_B_PWD" \
            -e "$PAT_B2" \
            "$FIXTURE" || true)

          if [[ -z "$FOUND" ]]; then
            echo "::error::Self-test FAILED: scanner did not detect any planted literals."
            echo "The patterns may be broken.  Fixture: $FIXTURE"
            exit 1
          fi

          # The count, not the lines: the planted literals are in the fixture,
          # and echoing them on every green run is noise.
          echo "Self-test passed — scanner detected $(wc -l <<< "$FOUND") planted literal(s)."

      # -----------------------------------------------------------------------
      # Self-test: verify the filters pass legitimate shapes.
      # Runs the full pattern + post-filter chain against a committed fixture
      # that contains env references and source identifiers.  Fails the job if
      # any of those legitimate shapes survive to become a finding, which would
      # mean the filters are broken.  The fixture is NOT allowlisted — it must
      # pass the scanner on its own.
      # -----------------------------------------------------------------------
      - name: Self-test — clean shapes must not be flagged
        run: |
          FIXTURE=".github/test-fixtures/secret-scan-selftest-clean.env"

          PAT_A='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'
          PAT_A2='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'
          PAT_B='[Pp]assword[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_BPASWD='[Pp]asswd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_B_PWD='pwd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_B2='"[Pp]assword"[[:space:]]*:[[:space:]]*"[^"$]'

          FOUND=$(grep -En \
            -e "$PAT_A" -e "$PAT_A2" \
            -e "$PAT_B" -e "$PAT_BPASWD" -e "$PAT_B_PWD" \
            -e "$PAT_B2" \
            "$FIXTURE" \
            | grep -Ev '(=|:)[[:space:]]*["'"'"']?[$][{A-Za-z_]' \
            | grep -Ev '="[[:space:]]*[+"]' \
            | grep -Ev '=[[:space:]]*[^[:space:]]*\(' \
            | grep -Ev '==[[:space:]]' \
            | grep -Ev '=[[:space:]]*[a-z][a-zA-Z0-9_]*;' \
            | grep -Ev ':[0-9]+:[[:space:]]*(#|//)' \
            | grep -Ev '(=|:)[[:space:]]*["'"'"']["'"'"']' \
            | grep -Ev ':[[:space:]]*(string|number|boolean)[;,)}[:space:]]*$' \
            || true)

          if [[ -n "$FOUND" ]]; then
            echo "::error::Self-test FAILED: scanner flagged a legitimate shape:"
            echo "$FOUND"
            exit 1
          fi

          echo "Self-test passed — no legitimate shapes were flagged."

      # -----------------------------------------------------------------------
      # Main scan — every committed text file, all extensions.
      #
      # Scanned patterns:
      #
      #   A   *PASSWORD* variable with a literal value.
      #       Shell, env-file, and properties syntax: KEY=value
      #       Value must not start with $ (env ref), space (prevents backtracking
      #       from consuming the separator space instead of the value char).
      #
      #   A2  *PASSWD* variable with a literal value (same syntax, 6-char key).
      #
      #   B   password / passwd / pwd key with a literal value.
      #       YAML and properties syntax: key: value
      #       Same backtracking guard: [^$[:space:]] at the value start.
      #
      #   B2  "password" JSON key with a quoted literal value.
      #       JSON syntax: "key": "value"
      #
      #   C  Credential embedded in a connection URL:
      #        scheme://user:literal@host  (inline credential in URL)
      #        ?password=value  &password=value  (query-string parameter)
      #
      # Excluded paths (deny-list — new file types scanned by default):
      #   .env.example — intentional placeholders; documents names only
      #   .env         — runtime file git-ignored by policy; excluded defensively
      #   .claude/     — agent worktrees; not part of the committed source tree
      #
      # Post-filters strip non-literal source patterns that the regex
      # over-matches:
      #   (=|:) "$VAR" / '...' / ${VAR}  →  quoted or bare env reference
      #   ="..." + …                      →  Java string-concatenation pattern
      #   method(…)                       →  value contains ( — it is a call
      #   identifier == …                 →  double-equals is a comparison
      #   identifier;                     →  trailing ; is a Java statement end
      #   # … or // …                     →  comment-only line in grep output
      #   : "" or = ''                    →  empty string literal: a cleared form
      #                                      field, never a credential
      #   : string | number | boolean     →  a TypeScript type annotation, not a
      #                                      value (`password: string;`)
      #
      # Findings covered by .github/secret-scan-allowlist.conf are suppressed.
      # Every allowlist entry must carry a written justification.
      # -----------------------------------------------------------------------
      - name: Scan for committed literal credentials
        run: |
          ALLOWLIST=".github/secret-scan-allowlist.conf"

          # Build allowlisted path list (skip comments and blank lines).
          mapfile -t ALLOWED_PATHS < <(grep -v '^\s*#' "$ALLOWLIST" | grep -v '^\s*$')

          # Pattern A: *PASSWORD* = <non-env literal>
          PAT_A='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'

          # Pattern A2: *PASSWD* = <non-env literal>  (6-char form)
          PAT_A2='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'

          # Pattern B: password | passwd | pwd key: <non-env literal>  (YAML/properties)
          PAT_B='[Pp]assword[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_BPASWD='[Pp]asswd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_B_PWD='pwd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'

          # Pattern B2: "password" : "literal"  (JSON quoted key and value)
          PAT_B2='"[Pp]assword"[[:space:]]*:[[:space:]]*"[^"$]'

          # Pattern C: URL-embedded credential
          # scheme://user:literal@host — value between : and @ must not start with $ or {
          PAT_C_URL='://[^:@[:space:]/]+:[^@[:space:]/\$\{][^@[:space:]]*@[a-zA-Z0-9]'
          # ?password=value or &password=value
          PAT_C_QS='[?&][Pp]assword=[^&[:space:]\$\{][^&[:space:]]*'

          RAW=$(git grep -rn --no-color -E \
            -e "$PAT_A" \
            -e "$PAT_A2" \
            -e "$PAT_B" \
            -e "$PAT_BPASWD" \
            -e "$PAT_B_PWD" \
            -e "$PAT_B2" \
            -e "$PAT_C_URL" \
            -e "$PAT_C_QS" \
            -- ':!.env.example' ':!.env' ':!.claude/' \
            || true)

          # ----
          # Post-filters: remove false positives that the regex over-matches.
          #
          # 1. Env references in value position: = "$VAR", = '${VAR}', : ${VAR}
          #    [$] is a character-class matching a literal dollar sign.
          # 2. Java string-concatenation: KEY="..." + something — the closing
          #    quote of a string literal is immediately followed by space + +.
          # 3. Method calls: value contains ( — Java/Groovy source identifier.
          # 4. Double-equals comparison: == follows a single = (Java/scripts).
          # 5. Bare lowercase identifier ending in ; — Java variable reference.
          # 6. Comment-only lines: git grep output whose content starts with
          #    # or // after optional whitespace.
          # ----
          FILTERED=$(echo "$RAW" \
            | grep -Ev '(=|:)[[:space:]]*["'"'"']?[$][{A-Za-z_]' \
            | grep -Ev '="[[:space:]]*[+"]' \
            | grep -Ev '=[[:space:]]*[^[:space:]]*\(' \
            | grep -Ev '==[[:space:]]' \
            | grep -Ev '=[[:space:]]*[a-z][a-zA-Z0-9_]*;' \
            | grep -Ev ':[0-9]+:[[:space:]]*(#|//)' \
            | grep -Ev '(=|:)[[:space:]]*["'"'"']["'"'"']' \
            | grep -Ev ':[[:space:]]*(string|number|boolean)[;,)}[:space:]]*$' \
            || true)

          # Apply the allowlist.
          VIOLATIONS=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            FILE="${line%%:*}"
            COVERED=false
            for ap in "${ALLOWED_PATHS[@]}"; do
              if [[ "$FILE" == "$ap" ]]; then
                COVERED=true
                break
              fi
            done
            if [[ "$COVERED" == false ]]; then
              VIOLATIONS+="$line"$'\n'
            fi
          done <<< "$FILTERED"

          if [[ -n "$VIOLATIONS" ]]; then
            echo "::error::Committed literal credential detected."
            echo ""
            echo "If this is a legitimate shape — a Testcontainers literal, a documentation"
            echo "example, or a test constant — add an entry to:"
            echo "  .github/secret-scan-allowlist.conf"
            echo "with a written justification.  The entry must be path-anchored."
            echo ""
            echo "$VIOLATIONS"
            exit 1
          fi

          echo "OK — no committed literal credentials found."

      # -----------------------------------------------------------------------
      # Agent instructions: one text, inside Codex's budget.
      #
      # Each CLAUDE.md is the source, and the AGENTS.md beside it is a symlink
      # to it so Codex reads the same text.  A symlink replaced by a copy, an
      # AGENTS.md with no CLAUDE.md beside it, or a CLAUDE.md with no AGENTS.md
      # starts two texts drifting apart, and nothing else would notice.
      #
      # Codex concatenates the files from the repository root down to its
      # working directory and stops at 32 KiB combined (its default
      # project_doc_max_bytes), dropping the rest without a word.  So every
      # root-to-directory chain of CLAUDE.md files is measured against it.
      #
      # It runs before the scope step on purpose: a change that touches only
      # Markdown skips every check after it (ADR-029), and Markdown is exactly
      # what this guards.
      # -----------------------------------------------------------------------
      - name: Agent instructions — AGENTS.md symlinks and Codex budget
        run: |
          LIMIT=32768
          FAILED=false

          # Every directory that tracks either file, root as ".".
          mapfile -t DIRS < <(git ls-files -- ':(glob)**/CLAUDE.md' ':(glob)**/AGENTS.md' \
            | sed -E 's#(^|/)[^/]+$##; s#^$#.#' | sort -u)

          for dir in "${DIRS[@]}"; do
            src="$dir/CLAUDE.md"; src="${src#./}"
            link="$dir/AGENTS.md"; link="${link#./}"

            if [[ -z "$(git ls-files -- "$src")" ]]; then
              echo "::error file=$link::$link has no CLAUDE.md beside it.  CLAUDE.md is the source; AGENTS.md only points at it."
              FAILED=true
              continue
            fi

            # Mode 120000 is a symlink; its blob is the target path.
            entry=$(git ls-files -s -- "$link")
            if [[ "${entry%% *}" != 120000 ]] || [[ "$(git cat-file blob ":$link")" != CLAUDE.md ]]; then
              echo "::error file=$src::$link must be a symlink to CLAUDE.md (ln -s CLAUDE.md $link), not a copy and not missing."
              FAILED=true
            fi

            # The chain Codex reads when it starts in this directory.
            total=0 chain="" d="$dir"
            while :; do
              f="$d/CLAUDE.md"; f="${f#./}"
              if [[ -n "$(git ls-files -- "$f")" ]]; then
                total=$(( total + $(wc -c < "$f") ))
                chain="$f${chain:+ + $chain}"
              fi
              [[ "$d" == . ]] && break
              d=$(dirname "$d")
            done

            if (( total > LIMIT )); then
              echo "::error file=$src::$chain is $total bytes, over Codex's $LIMIT-byte budget (project_doc_max_bytes); Codex drops whatever comes past it."
              FAILED=true
            else
              echo "$chain — $total of $LIMIT bytes."
            fi
          done

          if [[ "$FAILED" == true ]]; then
            exit 1
          fi

          echo "OK — every AGENTS.md is a symlink to its CLAUDE.md, and every chain fits."

      # -----------------------------------------------------------------------
      # Scope: which checks this run needs (ADR-029).
      #
      # The credential scan above always runs — a literal can land in an ADR or
      # a spec as easily as in code, and pattern C exists precisely because
      # connection URLs get pasted into prose.  What follows it is split by
      # what a change can reach:
      #
      #   backend   Java 25, the Docker check and `mvn clean verify`.
      #   frontend  Node, the portal's lint, format, typecheck, unit tests,
      #             build and accessibility suite.
      #   guard     the skipped-test guard's self-test.  The guard is the
      #             root POM's `fail-on-skipped-tests` and the self-test runs
      #             it in core, so a pull request runs it only when the root
      #             POM, core's, or this workflow changes.
      #
      # Each changed file of a pull request is classified below.  Markdown,
      # LICENSE and issue templates reach neither build (ADR-028).  The two
      # OpenAPI contracts reach both: the API generates its models and the CLI
      # its client from openapi-v1.yaml, and the SPA its types from
      # portal-api-v1.yaml, which $refs it.  Anything the classifier does not
      # name — this workflow, the scan's allowlist, a script — runs every
      # check, so a path nobody listed costs time, never a skipped check.
      #
      # Scheduled and manual runs check main's health and run every check, the
      # journey suite included.  So does every failure path here: a broken
      # lookup must never be able to skip a check.
      #
      # This is deliberately a step-level skip rather than
      # `on.pull_request.paths-ignore`: paths-ignore suppresses the whole run,
      # which would take the credential scan down with it, and would leave a
      # required status check pending forever if branch protection is ever
      # enabled here.
      # -----------------------------------------------------------------------
      - name: Determine which checks this run needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          run_everything() {
            printf '%s\n' backend=true frontend=true guard=true >> "$GITHUB_OUTPUT"
            echo "$1"
          }

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            run_everything "Non-pull-request event ($EVENT_NAME) — running every check."
            exit 0
          fi

          # The REST pulls/{n}/files entries carry the path in `filename`;
          # there is no `path` field on this endpoint.
          #
          # The exit status is checked explicitly rather than swallowed: on
          # failure `gh` prints its error body to stdout, which would otherwise
          # flow on as if it were a file list.
          if ! FILES_RAW=$(gh api --paginate \
                "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            run_everything "::warning::Could not list the pull request's changed files — running every check."
            exit 0
          fi

          # An empty answer means the API told us nothing useful.  Checked on
          # the raw text: a here-string always ends in a newline, so mapfile
          # would turn "" into one blank entry rather than none.
          if [[ -z "$FILES_RAW" ]]; then
            run_everything "Could not determine changed files — running every check."
            exit 0
          fi

          mapfile -t FILES <<< "$FILES_RAW"

          BACKEND=false FRONTEND=false GUARD=false
          for f in "${FILES[@]}"; do
            # A blank entry means the query returned a field that does not
            # exist.  Say so loudly: classified, it would fall through to the
            # unclassified row and run every check anyway, and the skip would
            # be dead code nobody notices.
            if [[ -z "$f" ]]; then
              run_everything "::warning::Changed-file query returned a blank path — the jq field name is probably wrong.  Running every check."
              exit 0
            fi
            # In a case pattern `*` matches `/`, so `*.md` covers docs/ and
            # every module's README.  Order matters: the first match wins.
            case "$f" in
              *.md|LICENSE|.github/ISSUE_TEMPLATE/*)
                ;;
              apps/api/src/main/openapi/*|portal/bff/src/main/openapi/*)
                BACKEND=true FRONTEND=true ;;
              portal/web/*)
                FRONTEND=true ;;
              pom.xml|core/pom.xml)
                BACKEND=true GUARD=true ;;
              core/*|adapters/*|apps/*|portal/pom.xml|portal/bff/*|infra/test-fixtures/*)
                BACKEND=true ;;
              *)
                echo "Unclassified path, running every check: $f"
                BACKEND=true FRONTEND=true GUARD=true ;;
            esac
          done

          printf '%s\n' "backend=$BACKEND" "frontend=$FRONTEND" "guard=$GUARD" >> "$GITHUB_OUTPUT"
          echo "${#FILES[@]} changed file(s) — backend: $BACKEND, frontend: $FRONTEND, guard self-test: $GUARD."
          if [[ "$BACKEND" == false && "$FRONTEND" == false ]]; then
            echo "Docs-only pull request — skipping both builds:"
            printf '  %s\n' "${FILES[@]}"
          fi

      - name: Set up Java 25
        if: steps.scope.outputs.backend == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # One line rather than `docker info`'s seventy: the server version is
      # what a failing Testcontainers suite needs, and the command fails when
      # no daemon answers, which is the check.
      - name: Verify Docker availability
        if: steps.scope.outputs.backend == 'true'
        run: docker version --format 'Docker server {{.Server.Version}} (API {{.Server.APIVersion}})'

      # -----------------------------------------------------------------------
      # Self-test: verify the skipped-test guard catches a skip before trusting
      # it.  Plants a report that claims one skipped test and runs the guard's
      # own execution against it.  Fails the job if the guard passes, which
      # would mean a silently skipped suite could once again reach BUILD
      # SUCCESS — the hole ADR-006 forbids.  The planted report is removed by
      # the `clean` in the Maven step that follows.
      #
      # On the scheduled and manual runs, and on a pull request that can change
      # what it tests (the scope step's `guard`).  It costs a Maven start of
      # its own, and on any other pull request it would re-prove a guard the
      # change cannot reach.
      # -----------------------------------------------------------------------
      - name: Self-test — skipped-test guard must reject a planted skip
        if: steps.scope.outputs.backend == 'true' && steps.scope.outputs.guard == 'true'
        run: |
          REPORT="core/target/failsafe-reports/TEST-GuardSelfTest.xml"
          mkdir -p "$(dirname "$REPORT")"
          cat > "$REPORT" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="GuardSelfTest" tests="1" skipped="1" failures="0" errors="0"/>
          XML

          if mvn --batch-mode --no-transfer-progress -pl core \
               antrun:run@fail-on-skipped-tests > guard-selftest.log 2>&1; then
            echo "::error::Self-test FAILED: the guard accepted a report claiming a skipped test."
            cat guard-selftest.log
            exit 1
          fi

          if ! grep -q "TEST-GuardSelfTest.xml" guard-selftest.log; then
            echo "::error::Self-test FAILED: the guard failed, but did not name the offending report."
            cat guard-selftest.log
            exit 1
          fi

          rm -f "$REPORT" guard-selftest.log
          echo "Self-test passed — the guard rejected the planted skip and named the report."

      # -----------------------------------------------------------------------
      # Maven verify, with the log kept to what a failure needs.
      #
      # - Test output goes to files. Every Spring context the suites start
      #   prints its banner and its startup log, and the suites that exercise
      #   error paths print the stack traces they provoke: well over half of
      #   this step's log on a green run.  Surefire and failsafe still print
      #   each failure, its assertion and its stack, and the per-class output
      #   is uploaded below when the build fails.
      # - JaCoCo, antrun and the OpenAPI generator log at WARN.  Their INFO
      #   lines (agent paths, "Executing tasks", one "writing file" per
      #   generated model) never explain a failure; a failed coverage check,
      #   skipped-test guard or generation still reports at WARN or ERROR.
      #   MAVEN_OPTS, not -D on the command line: Maven's logger reads its
      #   levels when the JVM starts, before the command line is parsed.
      # -----------------------------------------------------------------------
      - name: Maven verify
        if: steps.scope.outputs.backend == 'true'
        env:
          MAVEN_OPTS: >-
            -Dorg.slf4j.simpleLogger.log.org.jacoco=warn
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins.antrun=warn
            -Dorg.slf4j.simpleLogger.log.org.openapitools=warn
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dmaven.test.redirectTestOutputToFile=true
          clean verify

      # The test output the step above kept off the log, plus the reports, for
      # the run that needs them.
      - name: Upload the test reports
        if: failure() && steps.scope.outputs.backend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # Frontend build, test, and accessibility checks (ADR-017, ADR-014).
      #
      # The SPA is a standalone npm project, so Maven neither builds nor tests
      # it.  These steps run inside this job, not a separate one, for the same
      # per-job billing reason as the credential scan.
      #
      # Each piece of work runs once.  The npm scripts regenerate the contract
      # types before lint, typecheck, tests and build, and `build` type-checks
      # before bundling, so each script is safe on its own on a developer's
      # machine (`typecheck.test.ts` holds that wiring).  Here the types are
      # generated once and the typecheck is a step of its own; the later steps
      # pass --ignore-scripts, which runs the named script and skips its
      # pre-scripts, and the build step runs Vite alone.
      # -----------------------------------------------------------------------
      - name: Set up Node 24
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portal/web/package-lock.json

      # No audit and no funding notice: neither gates anything here, and the
      # audit is a network round trip on every run.
      - name: Frontend — install dependencies
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm ci --no-audit --no-fund

      - name: Frontend — generate the contract types
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm run generate:api

      # Type-aware ESLint with --max-warnings 0, so a warning fails like an
      # error.
      - name: Frontend — lint (ESLint)
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm run lint --ignore-scripts

      - name: Frontend — formatting (Prettier)
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm run format:check

      # Both projects: the browser code and the Node side (the Playwright
      # suites, their config, the Vite config and the Vitest environment).
      - name: Frontend — typecheck (tsc)
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm run typecheck --ignore-scripts

      # `test:coverage`, not `test`.  Vitest evaluates the coverage thresholds in
      # vite.config.ts only when --coverage is passed, so `npm test` would run
      # the same suite and hold no floor (ADR-019).
      - name: Frontend — unit tests and coverage floor (Vitest)
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm run test:coverage --ignore-scripts

      - name: Frontend — build (Vite)
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: |
          # --short=7, not bare --short (core.abbrev=auto grows with the object
          # count and drifts from the fixed length the Java artifacts use).
          #
          # Vite alone, not `npm run build`: that script's `tsc --noEmit` is
          # the first half of the typecheck step above.  A step added to the
          # build script has to be added here too.
          #
          # --logLevel warn drops Vite's line per emitted file — a hundred font
          # files alone — and keeps its warnings, the chunk-size one included.
          VITE_GIT_COMMIT=$(git rev-parse --short=7 HEAD) \
          VITE_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          npx vite build --logLevel warn

      # -----------------------------------------------------------------------
      # The browser for the Playwright suites.
      #
      # Only Chromium's headless shell, the build every suite runs on: no
      # project runs headed or names a channel.  It is cached under the
      # Playwright version, which pins the browser build, so a run downloads it
      # only when the version changes.
      #
      # The system packages are installed on every run, cache hit or not: the
      # runner image lacks fonts the browser renders with, and caching apt's
      # work would be a second package manager to keep honest.  Its transcript
      # and the progress bars are printed only when the install fails, the one
      # time they explain anything.
      # -----------------------------------------------------------------------
      - name: Frontend — read the Playwright version
        id: playwright
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: echo "version=$(npx playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Frontend — cache the Playwright browser
        if: steps.scope.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell

      - name: Frontend — install Playwright Chromium
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: |
          LOG="$RUNNER_TEMP/playwright-install.log"
          if ! npx playwright install --with-deps --only-shell chromium > "$LOG" 2>&1; then
            cat "$LOG"
            exit 1
          fi
          grep -E 'downloaded to' "$LOG" || echo "Chromium headless shell ready (from the cache)."

      - name: Frontend — accessibility tests (Playwright)
        if: steps.scope.outputs.frontend == 'true'
        working-directory: portal/web
        run: npm run test:a11y

      # Traces and screenshots are only written for failures, so this uploads
      # exactly the artifacts someone needs to diagnose an accessibility
      # regression they cannot reproduce locally.
      - name: Upload the Playwright report
        if: failure() && steps.scope.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            portal/web/playwright-report/
            portal/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # Journey suite — real-service browser acceptance (ADR-014).
      #
      # Not on every pull request: booting the whole stack costs more than the
      # signal it adds on each change, and the nightly run catches the same
      # regression within a day.  `mvn clean verify` remains the acceptance
      # command.
      #
      # A step-level guard rather than paths-ignore: paths-ignore suppresses
      # the whole run, which would take the credential scan above down with it.
      # -----------------------------------------------------------------------
      - name: Journey — run the real-service suite
        if: github.event_name != 'pull_request' && steps.scope.outputs.backend == 'true' && steps.scope.outputs.frontend == 'true'
        env:
          # Synthetic password for the throwaway CI Postgres container, used
          # only by this workflow run; not an operational credential.  The dev
          # token is generated by run-local.sh on every run.
          APP_DB_PASSWORD: ci-journey-pass
        # The exec jars from `Maven verify` and the bundle from the Vite step:
        # the suite runs against what this run already built and tested.
        run: infra/scripts/e2e.sh --no-build --no-spa-build

      # -----------------------------------------------------------------------
      # Scan the HTML report for literal credentials before retaining it, as the
      # main scan above does for the committed tree.
      #
      # Playwright HTML reports are text (HTML, JSON); traces and screenshots are
      # binary archives and images.  The scan targets text files only — binary
      # content cannot carry credential patterns the grep recognises, and the
      # stack uses synthetic data (ADR-014) so traces cannot carry real data.
      # -----------------------------------------------------------------------
      - name: Journey — scan report for credentials before upload
        if: failure() && github.event_name != 'pull_request' && steps.scope.outputs.backend == 'true' && steps.scope.outputs.frontend == 'true'
        run: |
          PAT_A='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Oo][Rr][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'
          PAT_A2='[A-Za-z_]*[Pp][Aa][Ss][Ss][Ww][Dd][A-Za-z_]*=[^$[:space:]][^[:space:]]*'
          PAT_B='[Pp]assword[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_BPASWD='[Pp]asswd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_B_PWD='pwd[[:space:]]*:[[:space:]]*[^$[:space:]][^[:space:]]*'
          PAT_B2='"[Pp]assword"[[:space:]]*:[[:space:]]*"[^"$]'
          PAT_C_URL='://[^:@[:space:]/]+:[^@[:space:]/\$\{][^@[:space:]]*@[a-zA-Z0-9]'
          PAT_C_QS='[?&][Pp]assword=[^&[:space:]\$\{][^&[:space:]]*'

          REPORT_DIR="portal/web/playwright-report"
          if [[ ! -d "$REPORT_DIR" ]]; then
            echo "No report directory — nothing to scan."
            exit 0
          fi

          FOUND=$(grep -rEn \
            -e "$PAT_A" -e "$PAT_A2" \
            -e "$PAT_B" -e "$PAT_BPASWD" -e "$PAT_B_PWD" \
            -e "$PAT_B2" -e "$PAT_C_URL" -e "$PAT_C_QS" \
            --include="*.html" --include="*.json" \
            "$REPORT_DIR" \
            | grep -Ev '(=|:)[[:space:]]*["'"'"']?[$][{A-Za-z_]' \
            | grep -Ev '="[[:space:]]*[+"]' \
            | grep -Ev '=[[:space:]]*[^[:space:]]*\(' \
            | grep -Ev '==[[:space:]]' \
            | grep -Ev '=[[:space:]]*[a-z][a-zA-Z0-9_]*;' \
            | grep -Ev ':[0-9]+:[[:space:]]*(#|//)' \
            | grep -Ev '(=|:)[[:space:]]*["'"'"']["'"'"']' \
            | grep -Ev ':[[:space:]]*(string|number|boolean)[;,)}[:space:]]*$' \
            || true)

          if [[ -n "$FOUND" ]]; then
            echo "::error::Literal credential pattern found in the Playwright report."
            echo "$FOUND"
            exit 1
          fi

          echo "OK — no credential patterns in the Playwright report."

      - name: Journey — upload report on failure
        if: failure() && github.event_name != 'pull_request' && steps.scope.outputs.backend == 'true' && steps.scope.outputs.frontend == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: journey-report
          path: |
            portal/web/playwright-report/
            portal/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
