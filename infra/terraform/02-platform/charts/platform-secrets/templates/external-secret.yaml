apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    # The API's database role, generated by 01-infra.
    - secretKey: APP_DB_PASSWORD
      remoteRef:
        key: {{ .Values.ssmPrefix }}/db/app-password
    # The BFF's OIDC client, issued by the identity provider and written to
    # SSM by a human (01-infra's secrets.tf).
    - secretKey: APP_OIDC_CLIENT_ID
      remoteRef:
        key: {{ .Values.ssmPrefix }}/oidc/client-id
    - secretKey: APP_OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.ssmPrefix }}/oidc/client-secret
