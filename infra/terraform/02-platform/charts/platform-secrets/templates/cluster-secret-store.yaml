apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStoreName }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.region }}
      # No `auth` block: the operator then uses its own pod credentials, which
      # are the IRSA role 01-infra scoped to {{ .Values.ssmPrefix }}/*.
